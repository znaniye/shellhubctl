version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wsl_v5
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|package-comments):"

formatters:
  enable:
    - gofumpt
